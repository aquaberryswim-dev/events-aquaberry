# Netlify settings for events.aquaberry.store (AquaBerry team, Free plan: 300 credits a month, shared with the store).
# A production deploy costs 15 credits, whichever way it is made (Git, CLI or drag-and-drop).
#
# Since Nov 13, 2026 Netlify builds from the GitHub repo (aquaberryswim-dev/events-aquaberry): every merge into main is a production
# deploy, and pull requests and admin drafts get free Deploy Previews.
# Response headers live in src/static/_headers so they apply to every deploy method.

[build]
  command = "npm run build"
  publish = "_site"
  # Skip a build (and its 15-credit production deploy) only when ALL of these are true:
  #   1. Netlify knows the last commit it built (CACHED_COMMIT_REF is set),
  #   2. that commit is not the one being built (after a failed build there is no cache, and Netlify then sets
  #      CACHED_COMMIT_REF to the current commit; comparing a commit with itself finds no changes and would
  #      cancel every build until one succeeds),
  #   3. nothing the site uses changed between the two (for example, a README-only edit).
  # Exit code 0 means "skip"; anything else, including an error, means "build".
  ignore = 'test -n "$CACHED_COMMIT_REF" && test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- src/ lib/ scripts/ eleventy.config.js package.json package-lock.json netlify.toml'

[build.environment]
  NODE_VERSION = "22"
